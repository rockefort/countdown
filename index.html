<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">

<title>Norske widgets</title>

<style>

body {
    font-family: -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    background:#f2f2f7;
    padding:10px;
}

.widget {
    background:#111;
    color:white;
    border-radius:24px;
    padding:22px;
    width:95%;
    margin:20px 0;
}

.label {
    color:#aaa;
    font-size:16px;
}

.big {
    font-size:30px;
    font-weight:700;
    margin-top:12px;
}

.small {
    font-size:18px;
    margin-top:10px;
}

select,button {
    font-size:16px;
    padding:10px;
    border-radius:12px;
    border:0;
}

button {
    background:#007aff;
    color:white;
    margin-top:10px;
}

.clock-widget {
    display:flex;
    align-items:center;
    gap:20px;
}

.target-clock-container {
    display:flex;
    align-items:center;
    gap:20px;
}

</style>

</head>


<body>


<div class="widget clock-widget">

    <canvas id="analogClock"
            width="120"
            height="120">
    </canvas>

    <div>
        <div class="label">
            Klokka er nå
        </div>

        <div id="clock"
             class="big">
        </div>
    </div>

</div>  





<h2>Nedtelling</h2>


<select id="timeSelect"></select>

<br>

<button onclick="setCountdown()">
Sett nedtelling
</button>



<div class="widget">

<div class="label">
Hvor lenge er det til
</div>

<div id="target" class="big">
-
</div>
<hr />
<div id="remaining" class="small">
-
</div>
<div id="approximate" class="small">
-
</div>

<hr />

<div class="target-clock-container">

    <canvas id="targetClock"
            width="140"
            height="140">
    </canvas>

    <div class="target-digital">

        <div id="targetDigital"
             class="big">
        </div>

        <div id="targetDigitalText"
             class="small">
        </div>

    </div>

</div>

</div>



<script>


// --------------------------
// Norske klokkeslett
// --------------------------

let lastTarget = null;

const numbers=[
"tolv",
"ett",
"to",
"tre",
"fire",
"fem",
"seks",
"sju",
"åtte",
"ni",
"ti",
"elleve"
];


function hourName(h){

    return numbers[h % 12];

}



function norwegianForTime(date){

    let h=date.getHours();
    let m=date.getMinutes();


    switch(m){

        case 0:
            return hourName(h)+" presis";

        case 5:
            return "fem over "+hourName(h);

        case 10:
            return "ti over "+hourName(h);

        case 15:
            return "kvart over "+hourName(h);

        case 20:
            return "ti på halv "+hourName(h+1);

        case 25:
            return "fem på halv "+hourName(h+1);

        case 30:
            return "halv "+hourName(h+1);

        case 35:
            return "fem over halv "+hourName(h+1);

        case 40:
            return "ti over halv "+hourName(h+1);

        case 45:
            return "kvart på "+hourName(h+1);

        case 50:
            return "ti på "+hourName(h+1);

        case 55:
            return "fem på "+hourName(h+1);

        default:
            return "";
    }

}



// alltid neste 5-minutt

function ceilToFiveMinutes(date){

    let d=new Date(date);

    d.setSeconds(0);
    d.setMilliseconds(0);


    let minutes=d.getMinutes();

    let rounded=
        Math.ceil(minutes/5)*5;


    if(rounded===60){

        d.setHours(
            d.getHours()+1
        );

        rounded=0;
    }


    d.setMinutes(rounded);

    return d;

}

function roundToNearestFiveMinutes(date){

    let d = new Date(date);

    let minutes = d.getMinutes();

    let rounded =
        Math.round(minutes / 5) * 5;


    if (rounded === 60) {
        d.setHours(
            d.getHours()+1
        );
        rounded = 0;
    }


    d.setMinutes(rounded);
    d.setSeconds(0);
    d.setMilliseconds(0);

    return d;
}


function pad(n){

    return n.toString().padStart(2,"0");

}



// --------------------------
// Klokke-widget
// --------------------------


function updateClock(){

    let d=new Date();


    document.getElementById("clock")
    .innerText =         pad(d.getHours())+
        ":"+
        pad(d.getMinutes())+" - "+
    norwegianForTime(
        roundToNearestFiveMinutes(d)
    )

}


setInterval(
    updateClock,
    1000
);

updateClock();




// --------------------------
// Dropdown
// --------------------------


function addOption(date){

    let option=
    document.createElement("option");


    option.text =
        pad(date.getHours())+
        ":"+
        pad(date.getMinutes())+
        " - "+
        norwegianForTime(date);


    option.value =
        date.toISOString();


    document
    .getElementById("timeSelect")
    .appendChild(option);

}



function createDropdown(){


    let select =
    document.getElementById("timeSelect");


    select.innerHTML="";


    let start =
    ceilToFiveMinutes(new Date());



    // neste to timer - hvert 5 min

    let end =
    new Date(
        start.getTime()
        +
        120*60000
    );


    for(
        let d=new Date(start);
        d<=end;
        d.setMinutes(
            d.getMinutes()+5
        )
    ){

        addOption(
            new Date(d)
        );

    }



    let sep =
    document.createElement("option");

    sep.text =
    "──────────";

    sep.disabled=true;

    select.appendChild(sep);



    // Deretter halvtimer

    let half =
    new Date(start);


    if(half.getMinutes() < 30){

        half.setMinutes(30);

    }
    else {

        half.setHours(
            half.getHours()+1
        );

        half.setMinutes(0);

    }


    for(let i=0;i<12;i++){

        addOption(
            new Date(half)
        );

        half.setMinutes(
            half.getMinutes()+30
        );

    }

}



createDropdown();




// --------------------------
// Countdown
// --------------------------


function setCountdown(){

    let select =
        document.getElementById("timeSelect");

    let option =
        select.options[select.selectedIndex];


    localStorage.setItem(
        "countdown",
        JSON.stringify({
            timestamp: option.value,
            description: option.text
        })
    );


    updateCountdown();
    updateTargetDigital();

}

function updateCountdown(){

    let raw =
    localStorage.getItem("countdown");

    if(!raw)
        return;

    let data =
    JSON.parse(raw);

    let target =
    new Date(data.timestamp);

    let diff = target - new Date();


    if(diff <= 0){

        document.getElementById("remaining").innerText = "Nå";
        document.getElementById("approximate").innerText = "";

        return;
    }


    // TOTALT antall minutter
    let minutes = Math.floor(diff / 60000);


    let hours = Math.floor(minutes / 60);
    let mins = minutes % 60;

    document.getElementById("target")
    .innerText =
      data.description;

    document.getElementById("remaining")
    .innerText =
        hours + " t " + mins + " min igjen";


    document.getElementById("approximate")
    .innerText =
        approximateRemaining(minutes);
}

function approximateRemaining(minutes) {

    let hours = Math.floor(minutes / 60);
    let rest = minutes % 60;

    // rund til nærmeste kvarter
    let quarters = Math.round(rest / 15);


    // 4 kvarter = ny time
    if (quarters === 4) {
        hours++;
        quarters = 0;
    }


    let result = "Ca ";


    if (hours === 1) {
        result += "1 time";
    }
    else if (hours > 1) {
        result += hours + " timer";
    }


    if (quarters > 0 && hours > 0) {
        result += " og ";
    }


    switch (quarters) {
        case 1:
            result += "ett kvarter";
            break;

        case 2:
            result += "en halvtime";
            break;

        case 3:
            result += "tre kvarter";
            break;
    }


    if (hours === 0 && quarters === 0) {
        return "Om noen minutter";
    }


    return result;
}

function drawAnalogClock(){

    const canvas =
        document.getElementById("analogClock");

    const ctx =
        canvas.getContext("2d");

    const r = canvas.width / 2;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.save();

    ctx.translate(r,r);


    // Clock face

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        r-5,
        0,
        Math.PI*2
    );

    ctx.stroke();



    // Numbers 1-12

    ctx.font =
        "14px -apple-system";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.strokeStyle = "white";
    ctx.fillStyle = "white";    


    for(let i=1;i<=12;i++){

        let angle =
            i * Math.PI / 6
            - Math.PI / 2;


        let x =
            Math.cos(angle)
            * (r-18);


        let y =
            Math.sin(angle)
            * (r-18);


        ctx.fillText(
            i.toString(),
            x,
            y
        );
    }



    // Hands

    let now =
        new Date();


    let seconds =
        now.getSeconds();


    let minutes =
        now.getMinutes()
        +
        seconds/60;


    let hours =
        (now.getHours()%12)
        +
        minutes/60;



    drawHand(
        ctx,
        hours * Math.PI/6,
        r*0.45,
        4
    );


    drawHand(
        ctx,
        minutes * Math.PI/30,
        r*0.70,
        3
    );


    // Optional seconds hand

    drawHand(
        ctx,
        seconds * Math.PI/30,
        r*0.80,
        1
    );


    // Center dot

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();

}

function drawHand(
    ctx,
    angle,
    length,
    width
){

    ctx.beginPath();

    ctx.lineWidth =
        width;

    ctx.moveTo(
        0,
        0
    );

    ctx.rotate(
        angle
        - Math.PI/2
    );

    ctx.lineTo(
        length,
        0
    );

    ctx.stroke();

    ctx.rotate(
        -(angle-Math.PI/2)
    );

}


function drawTargetClock(minutesFromMidnight) {

    const canvas =
        document.getElementById("targetClock");

    const ctx =
        canvas.getContext("2d");


    const r =
        canvas.width / 2;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.save();

    ctx.translate(r,r);


    ctx.strokeStyle="white";
    ctx.fillStyle="white";


    // klokkehus

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        r-5,
        0,
        Math.PI*2
    );

    ctx.stroke();



    // tall

    ctx.font =
        "14px -apple-system";

    ctx.textAlign="center";
    ctx.textBaseline="middle";


    for(let i=1;i<=12;i++){

        let angle =
            i*Math.PI/6
            -
            Math.PI/2;


        ctx.fillText(
            i,
            Math.cos(angle)*(r-18),
            Math.sin(angle)*(r-18)
        );
    }



    let hours =
        (minutesFromMidnight/60)%12;


    let minutes =
        minutesFromMidnight%60;



    drawHand(
        ctx,
        hours*Math.PI/6,
        r*0.45,
        4
    );


    drawHand(
        ctx,
        minutes*Math.PI/30,
        r*0.7,
        3
    );



    // senter

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();

}

function drawTargetClock(minutesFromMidnight) {

    const canvas =
        document.getElementById("targetClock");

    const ctx =
        canvas.getContext("2d");


    const r =
        canvas.width / 2;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.save();

    ctx.translate(r,r);


    ctx.strokeStyle="white";
    ctx.fillStyle="white";


    // klokkehus

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        r-5,
        0,
        Math.PI*2
    );

    ctx.stroke();



    // tall

    ctx.font =
        "14px -apple-system";

    ctx.textAlign="center";
    ctx.textBaseline="middle";


    for(let i=1;i<=12;i++){

        let angle =
            i*Math.PI/6
            -
            Math.PI/2;


        ctx.fillText(
            i,
            Math.cos(angle)*(r-18),
            Math.sin(angle)*(r-18)
        );
    }



    let hours =
        (minutesFromMidnight/60)%12;


    let minutes =
        minutesFromMidnight%60;



    drawHand(
        ctx,
        hours*Math.PI/6,
        r*0.45,
        4
    );


    drawHand(
        ctx,
        minutes*Math.PI/30,
        r*0.7,
        3
    );



    // senter

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();

}

function animateTargetClock(){

    updateTargetDigital();

    let raw =
        localStorage.getItem("countdown");


    if(!raw)
        return;


    let data =
        JSON.parse(raw);


    let target =
        new Date(data.timestamp);


    let now =
        new Date();


    let startMinutes =
        now.getHours()*60 +
        now.getMinutes();


    let endMinutes =
        target.getHours()*60 +
        target.getMinutes();



    /*
        Timeline:

        0-3000ms:
            stå stille på nå

        3000-9000ms:
            animasjon

        9000-12000ms:
            stå stille på mål
    */


    const cycle =
        12000;


    let elapsed =
        Date.now()%cycle;


    let displayMinutes;



    if(elapsed < 3000){

        // start pause

        displayMinutes =
            startMinutes;

    }


    else if(elapsed < 9000){

        // bevegelse

        let t =
            (elapsed-3000)/6000;


        let eased =
            easeInOut(t);


        displayMinutes =
            startMinutes +
            (endMinutes-startMinutes)
            *
            eased;

    }


    else {

        // mål pause

        displayMinutes =
            endMinutes;

    }



    drawTargetClock(
        displayMinutes
    );
    updateAnimatedDigital(displayMinutes);

    requestAnimationFrame(
        animateTargetClock
    );

}

function updateAnimatedDigital(minutes){

    let h = Math.floor(minutes / 60) % 24;
    let m = Math.floor(minutes % 60);


    document.getElementById("targetDigital")
        .innerText =
        String(h).padStart(2,"0")
        + ":"
        +
        String(m).padStart(2,"0");

}



function easeInOut(t){

    return t*t*(3-2*t);

}

animateTargetClock();

function updateTargetDigital(){

    let raw =
        localStorage.getItem("countdown");


    if(!raw)
        return;


    // Nothing changed since last update
    if(raw === lastTarget)
        return;


    // Remember this version
    lastTarget = raw;


    let data =
        JSON.parse(raw);


    let target =
        new Date(data.timestamp);


    document.getElementById("targetDigital")
        .innerText =
        target.toLocaleTimeString(
            "no-NO",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    document.getElementById("targetDigitalText")
        .innerText =
        data.description;
}

setInterval(()=>{
    updateClock();
    drawAnalogClock();
},1000);


drawAnalogClock();


updateCountdown();


</script>


</body>
</html>
