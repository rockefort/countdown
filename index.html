<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">

<title>Norske widgets</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="sidebar">
    <div class="nav-item active" data-page="na" onclick="showPage('na')">Nå</div>
    <div class="nav-item" data-page="quiz" onclick="showPage('quiz')">Quiz</div>
</nav>

<div class="content">

<div class="page active" id="page-na">

<div class="widgets">

<div class="widget clock-widget">

    <canvas id="analogClock"
            width="220"
            height="220">
    </canvas>

    <div>
        <div class="label">
            Klokka er nå
        </div>

        <div id="clock"
             class="big">
        </div>
    </div>

</div>

<div class="widget">
<h2>Nedtelling</h2>

<div class="label">
Hvor lenge er det til
</div>

<div id="target" class="big">

</div>
<hr />
<div id="remaining" class="small">

</div>
<div id="approximate" class="small">

</div>

<hr />

<div class="target-clock-container">

    <canvas id="targetClock"
            width="220"
            height="220">
    </canvas>

    <div class="target-digital">

        <div id="targetDigital"
             class="big">
        </div>

        <div id="targetDigitalText"
             class="small">
        </div>

    </div>

</div>

<hr />
<div class="controls">
    <h2>Endre nedtelling til</h2>
    <select id="timeSelect"></select>

    <button onclick="setCountdown()">
        Sett
    </button>

</div>

</div>

</div>

</div>

<div class="page" id="page-quiz">

    <div class="widgets">

        <div class="widget" id="quiz-start">
            <div class="quiz-start-form">
                <h2>Lese klokka</h2>
                <div>
                    <div class="label">Nivå</div>
                    <div class="level-row" id="level-row">
                        <button class="level-btn active" data-level="1">1</button>
                        <button class="level-btn" data-level="2">2</button>
                        <button class="level-btn" data-level="3">3</button>
                        <button class="level-btn" data-level="4">4</button>
                        <button class="level-btn" data-level="5">5</button>
                    </div>
                </div>
                <div>
                    <div class="label">Klokke</div>
                    <div class="mode-row" id="mode-row">
                        <button class="mode-btn active" data-mode="analog">Analog</button>
                        <button class="mode-btn" data-mode="digital">Digital</button>
                        <button class="mode-btn" data-mode="begge">Begge</button>
                    </div>
                </div>
                <button id="quiz-start-btn">Start</button>
            </div>
        </div>

        <div class="widget" id="quiz-active" style="display:none;">
            <div class="quiz-header">
                <span id="quiz-level-badge" class="label"></span>
                <span id="quiz-streak-dots"></span>
            </div>
            <div class="quiz-clock-area" id="quiz-clock-area"></div>
            <div class="quiz-options" id="quiz-options"></div>
        </div>

        <div class="widget quiz-success" id="quiz-success" style="display:none;">
            <div class="big" style="margin:0;">Bra!</div>
            <div id="quiz-success-msg" class="small"></div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
                <button id="quiz-next-btn" style="font-size:16px;padding:10px 24px;border-radius:10px;background:#f30f67;color:white;border:none;font-weight:600;cursor:pointer;">Neste nivå</button>
                <button id="quiz-repeat-btn" style="font-size:16px;padding:10px 24px;border-radius:10px;background:rgba(255,255,255,0.15);color:white;border:2px solid #f30f67;font-weight:600;cursor:pointer;">Spill igjen</button>
                <button id="quiz-level-btn" style="font-size:16px;padding:10px 24px;border-radius:10px;background:rgba(255,255,255,0.15);color:white;border:2px solid #f30f67;font-weight:600;cursor:pointer;">Meny</button>
            </div>
        </div>

    </div>

</div>

</div>

<script src="shared.js"></script>
<script src="now.js"></script>
<script src="quiz.js"></script>

</body>
</html>
